name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, curl
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: php server/tests/run.php
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: parto-place
          path: release/parto-place.zip
